# Generated by HarnessEngineering services/dependabot.
#
# Merges Dependabot patch/minor PRs once every other check on the PR (CI,
# Vercel preview, ...) has passed. Major updates are left for a human.
#
# Does not rely on branch protection: this job waits for the other checks
# itself. If the PR has no other checks at all, it refuses to merge — an
# update nothing has verified should wait for a human.
#
# Daily-News customization: this repo's only Dependabot ecosystem is
# github-actions, so every Dependabot PR edits .github/workflows/. GITHUB_TOKEN
# can never hold the `workflows` permission and cannot merge such PRs, so the
# merge uses the Dependabot secret DEPENDABOT_MERGE_TOKEN (a fine-grained PAT
# limited to this repo: Contents, Pull requests and Workflows = read/write).
# It is only exposed to the final `gh pr merge`, never to third-party actions.
# Re-running `install.sh add . --with dependabot` overwrites this file — re-apply
# the change if you do.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2.5.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for the other checks, then merge patch/minor updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          SELF: ${{ github.workflow }}
          MERGE_TOKEN: ${{ secrets.DEPENDABOT_MERGE_TOKEN }}
        run: |
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) ;;
            *)
              echo "Update type '$UPDATE_TYPE' is not patch/minor — leaving this PR for manual review."
              exit 0
              ;;
          esac

          # Fail fast instead of waiting up to 40 minutes for checks we could not act on.
          if [ -z "$MERGE_TOKEN" ]; then
            echo "::error::Dependabot secret DEPENDABOT_MERGE_TOKEN is not set — GITHUB_TOKEN cannot merge PRs that change workflow files. Add the secret (Settings → Secrets and variables → Dependabot), or review and merge manually."
            exit 1
          fi

          grace=$((SECONDS + 5 * 60))
          deadline=$((SECONDS + 40 * 60))
          while :; do
            checks=$(gh pr checks "$PR_URL" --json name,bucket,workflow 2>/dev/null || true)
            others=$(jq --arg self "$SELF" '[.[] | select(.workflow != $self)]' <<<"${checks:-[]}")
            total=$(jq length <<<"$others")
            pending=$(jq '[.[] | select(.bucket == "pending")] | length' <<<"$others")
            failed=$(jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length' <<<"$others")

            if [ "$failed" -gt 0 ]; then
              echo "::error::Checks failed — not merging. Fix the incompatibility or merge manually."
              jq -r '.[] | select(.bucket == "fail" or .bucket == "cancel") | "  - \(.name)"' <<<"$others"
              exit 1
            fi
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              break
            fi
            if [ "$total" -eq 0 ] && [ "$SECONDS" -ge "$grace" ]; then
              echo "::error::No other checks ran on this PR, so nothing verified the update — not merging. Add CI to this repo, or review and merge manually."
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for checks — not merging."
              exit 1
            fi
            sleep 30
          done

          echo "All $total other checks passed — merging $UPDATE_TYPE."
          GH_TOKEN="$MERGE_TOKEN" gh pr merge "$PR_URL" --squash
