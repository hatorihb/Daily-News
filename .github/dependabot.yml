# Generated by HarnessEngineering services/dependabot — re-run './install.sh add . --with dependabot' after adding a package directory.
# Weekly: one grouped PR of minor/patch updates per entry, each release held 5 days
# (cooldown) before it is proposed. Majors are not proposed (allow.update-types).
# Security updates are unaffected by all of this: they open immediately, majors included.
# Do not add ignore: rules — they also block security updates.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      non-major:
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 5
